<!DOCTYPE html>
<html lang="vi" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nguyễn Trung Nguyên - Portfolio cá nhân sinh viên Kỹ thuật Phần mềm (FPT University)">
  <title>Nguyễn Trung Nguyên | Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  
  <script>
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark');
      document.documentElement.setAttribute('data-theme', 'light');
    } else {
      document.documentElement.classList.add('dark');
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
  
  <!-- Font chữ Plus Jakarta Sans & Inter: Hỗ trợ 100% tiếng Việt chuẩn, không bao giờ bị lỗi dấu -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
